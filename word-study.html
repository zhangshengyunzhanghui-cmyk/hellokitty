:root {
  --bg: #f4f7f3;
  --paper: #fff;
  --ink: #17332b;
  --muted: #52685e;
  --line: #dce6dd;
  --accent: #27604c;
  --soft: #e8f2eb;
  --card: #fffdf6;
  --back: #204b3d;
  --back-light: #326750;
  --gold: #f4d88b;
  --card-height: 370px;
}
body[data-mode=challenge] {
  --bg: #f7f5fb;
  --ink: #35274c;
  --muted: #675a7b;
  --line: #e6deef;
  --accent: #674c8f;
  --soft: #efe8f7;
  --card: #fffcff;
  --back: #443367;
  --back-light: #654f8b;
}
body { background: radial-gradient(ellipse at 70% 5%, var(--soft), transparent 52%), var(--bg); }
.head { max-width: 1160px; padding-block: 14px; }
.head a:hover { color: var(--accent); }
main { max-width: 1160px; padding: 30px 32px 36px; }
.layout { grid-template-columns: 244px minmax(0, 1fr); gap: 32px; }
.sidebar {
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 8px 24px #172c2010;
}
.sidebar h2 { margin: 0 0 12px; font-size: 16px; }
.sidebar .field { margin: 10px 0; }
.field > span.library-select { margin-bottom: 0; }
.sidebar select { min-height: 42px; padding-block: 9px; }
.library-select::after { top: 5px; }
.divider { margin: 16px 0; }
.mode-note { min-height: 0; }
.settings { background: var(--bg); }
.intro { align-items: center; margin-bottom: 18px; }
.intro h1 { margin: 0 0 6px; }
.mode-status { border: 1px solid var(--line); }
.progress-line { margin-bottom: 16px; }
.progress { background: var(--line); }
.tabs {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 4px;
  margin: 0 0 14px;
  padding: 4px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 13px;
}
.tabs button { min-height: 42px; padding: 8px 3px; border: 0; border-radius: 9px; }
.tabs button:hover { color: var(--accent); background: var(--bg); }
.tabs button[aria-selected=true] { color: #fff; background: var(--accent); }
.deck { margin-bottom: 18px; }
.deck::before { background: var(--soft); }
.front { background: var(--card); border-color: var(--line); }
.back { background: linear-gradient(135deg, var(--back), var(--back-light)); }
.face::before { border-color: var(--accent); opacity: .055; }
.back::before { border-color: #fff; opacity: .09; }
.front .tag { background: var(--soft); color: var(--accent); }
.back .tag, .back .flip { background: var(--gold); color: #282316; }
.nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.nav button { padding-inline: 5px; }
.nav #flip-button { border-color: var(--line); background: var(--soft); }
.nav button:hover:not(:disabled), .review button:hover:not(:disabled) { filter: brightness(.96); }
.review.inactive { display: none; }
.feedback { text-align: center; }
.notes-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  height: var(--card-height);
  margin-bottom: 18px;
  padding: clamp(16px, 4vw, 30px);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 8px 24px #172c2010;
}
.notes-panel label { font-size: 16px; font-weight: 750; }
.notes-panel textarea {
  flex: 1;
  min-height: 0;
  resize: none;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  line-height: 1.6;
}
.notes-panel textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notes-status { min-height: 1.5em; margin: 0; color: var(--muted); font-size: 12px; }
@media (max-width: 820px) {
  :root { --card-height: 340px; }
  main { padding: 20px; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
}
@media (max-width: 390px) {
  main { padding: 14px; }
  .sidebar { padding: 15px; }
  .tabs button { font-size: 13px; }
  .nav { gap: 6px; }
}

.tabs button[data-tab="notes"]:not([aria-selected="true"]) {
  background: var(--soft);
  color: var(--accent);
}
.notes-panel { height: var(--card-height); }
.panel-heading { margin: 0; font-size: 18px; line-height: 1.35; }
.idea-content {
  flex: 1;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 14px;
  margin: 0;
  border-radius: 12px;
  background: var(--bg);
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.idea-content[data-empty="true"] { color: var(--muted); }
.panel-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-actions button {
  flex-shrink: 0;
  min-height: 42px;
  padding: 8px 14px;
  border: 0;
  border-radius: 9px;
  color: white;
  background: var(--accent);
  font-weight: 700;
}
@media (max-width: 390px) {
  .tabs button { padding-inline: 0; font-size: 12px; }
}

.sidebar { padding: 16px; display: grid; gap: 16px; }
.control-group + .control-group { border-top: 1px solid var(--line); padding-top: 15px; }
.control-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 11px; }
.sidebar .control-heading h2 { margin: 0; }
.control-heading .unit-caption { margin: 0; white-space: nowrap; }
.sidebar .fields, .settings-fields { display: grid; gap: 10px; }
.sidebar .field { min-width: 0; margin: 0; }
.sidebar .field > span:first-child { margin-bottom: 5px; }
.sidebar .select-shell { position: relative; margin: 0; }
.select-shell::after, .settings summary::after {
  content: "";
  width: 7px; height: 7px;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  color: var(--accent);
  transform: translateY(-70%) rotate(45deg);
}
.select-shell::after { position: absolute; right: 13px; top: 50%; pointer-events: none; }
.sidebar .select-shell select {
  display: block; appearance: none; min-height: 44px;
  padding: 9px 29px 9px 11px;
  border-radius: 10px; background: var(--paper);
  font-size: 14px; font-weight: 650; cursor: pointer;
}
.sidebar .select-library select { background: var(--soft); color: var(--accent); }
.sidebar select:hover { border-color: var(--accent); }
.sidebar .mode { gap: 4px; padding: 4px; background: var(--bg); border: 1px solid var(--line); }
.sidebar .mode button { min-height: 36px; padding: 6px 3px; font-size: 13px; }
.sidebar .mode button[aria-pressed="true"] { background: var(--accent); color: white; box-shadow: none; }
.sidebar .mode-note { margin-top: 8px; }
.sidebar .settings { margin: 10px 0 0; padding: 0; background: var(--paper); }
.settings summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 9px 12px; border-radius: 11px; }
.settings summary::-webkit-details-marker { display: none; }
.settings summary:hover, .settings[open] summary { background: var(--soft); color: var(--accent); }
.settings summary::after { transform: translateY(-2px) rotate(45deg); }
.settings[open] summary::after { transform: translateY(2px) rotate(225deg); }
.settings-fields { padding: 11px 12px 12px; }
.mastered { margin: 0; padding: 9px 10px; border-radius: 10px; background: var(--soft); color: var(--accent); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
@media (max-width: 820px) {
  .sidebar .fields, .settings-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

</aside>
<section class="workspace"><div class="intro"><div><h1>逐词精讲</h1><p id="subtitle">高中 · 一词多义一</p></div><div class="mode-status" id="mode-status">自学模式</div></div><div class="progress-line"><span>卡片进度</span><div class="progress" role="progressbar" aria-label="当前卡片位置" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1"><span id="bar" style="width:33.33%"></span></div><span class="counter" id="counter">01 / 03</span></div>
<div class="tabs" role="tablist" aria-label="学习内容"><button role="tab" data-tab="word" aria-selected="false">单词</button><button role="tab" data-tab="phrase" aria-selected="false">短语</button><button role="tab" data-tab="sentence" aria-selected="true">句子</button><button id="ideas-tab" role="tab" data-tab="ideas" aria-controls="ideas-panel" aria-selected="false">奇思妙想</button><button id="notes-tab" role="tab" data-tab="notes" aria-controls="notes-panel" aria-selected="false">我要补充</button></div><div class="deck" id="deck"><button class="card" id="card" aria-label="点击翻面" aria-pressed="false"><span class="inner"><span class="face front" id="front"><span class="top"><span id="frontlabel">对应义项例句</span><span class="tag" id="fronttag">中文</span></span><span class="content"><strong id="question"></strong><small id="qhint"></small></span><span class="bottom"><span>智汇学堂 · WORD LAB</span><span>点击翻面 <span class="flip">↻</span></span></span></span><span class="face back" id="back" aria-hidden="true"><span class="top"><span id="backlabel">英文答案</span><span class="tag" id="backtag">ENGLISH</span></span><span class="content"><strong id="answer"></strong><small id="ahint"></small></span><span class="bottom"><span>智汇学堂 · WORD LAB</span><span>返回正面 <span class="flip">↻</span></span></span></span></span></button></div>

<section class="notes-panel" id="ideas-panel" role="tabpanel" aria-labelledby="ideas-tab" hidden>
  <h2 class="panel-heading">奇思妙想</h2>
  <p class="idea-content" id="idea-content" tabindex="0"></p>
  <p class="notes-status" id="idea-status" aria-live="polite"></p>
</section>
<form class="notes-panel" id="notes-panel" role="tabpanel" aria-labelledby="notes-tab" hidden>
  <label class="panel-heading" for="note">补充到奇思妙想</label>
  <textarea id="note" placeholder="输入联想记忆、其他义项或自己的例句" required></textarea>
  <div class="panel-actions">
    <p class="notes-status" id="notes-status" aria-live="polite">补充内容按词条保存在当前浏览器。</p>
    <button type="submit">保存补充</button>
  </div>
</form>
<div class="nav"><button id="prev">← 上一张</button><button id="flip-button">翻转卡牌 ↻</button><button class="primary" id="next">下一张 →</button></div><div class="review inactive" id="review" aria-hidden="true"><button id="again" disabled>再记一次</button><button id="got" disabled>已掌握 ✓</button></div><p class="feedback" id="feedback" aria-live="polite">空格翻面 · 左右方向键切换卡片</p></section></div></main>
<script>
const words=[{word:'down',ipa:'/daʊn/',pos:'adv.',cn:'作为首付款',phrase:'pay $1,000 down',phraseCn:'先付一千美元作为首付款',sentence:'I paid $1,000 down on the car.',sentenceCn:'我付了一千美元作为这辆车的第一笔款。',grammar:'pay + 金额 + down + on + 商品，表示为某物支付首付款。'},{word:'afford',ipa:'/əˈfɔːd/',pos:'v.',cn:'买得起；负担得起',phrase:'afford to buy',phraseCn:'买得起',sentence:'I cannot afford to buy a new car.',sentenceCn:'我买不起一辆新车。',grammar:'afford to do sth. 表示有能力承担做某事的费用。'},{word:'purchase',ipa:'/ˈpɜːtʃəs/',pos:'v. / n.',cn:'购买',phrase:'make a purchase',phraseCn:'进行购买',sentence:'She purchased a new laptop.',sentenceCn:'她买了一台新笔记本电脑。',grammar:'purchase 可作动词或名词，语气比 buy 更正式。'}];
const libraries=[{id:'polysemy-1',grade:'high',title:'一词多义一',words}];
const $=id=>document.getElementById(id);let library=libraries[0],index=0,tab='sentence',mode='self',direction='cn',flipped=false,explain=true;const mastery=new Map();function known(){if(!mastery.has(library.id))mastery.set(library.id,new Set());return mastery.get(library.id)}
function populateLibraries(){const options=libraries.filter(l=>l.grade===$('grade').value);$('library').replaceChildren(...options.map(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.title;return o}));if(options.length){library=options.find(l=>l.id===library.id)||options[0];$('library').value=library.id;}index=0;render()}
function flip(v){flipped=v;$('card').classList.toggle('flipped',v);$('card').setAttribute('aria-pressed',String(v));$('card').setAttribute('aria-label',v?'返回正面':'点击翻面');$('front').setAttribute('aria-hidden',String(v));$('back').setAttribute('aria-hidden',String(!v));$('flip-button').textContent=v?'返回正面 ↻':'翻转卡牌 ↻';const show=v&&mode==='challenge';$('review').classList.toggle('inactive',!show);$('review').setAttribute('aria-hidden',String(!show));$('again').disabled=!show;$('got').disabled=!show}
const sessionNotes = new Map();
const drafts = new Map();
const sessionOnly = new Set();

function noteKey() {
  return 'word-study:notes:' + JSON.stringify([library.id, library.words[index].word]);
}

function readIdeas(key) {
  if (sessionNotes.has(key)) return sessionNotes.get(key);
  try {
    return localStorage.getItem(key) ?? '';
  } catch {
    return '';
  }
}

function showIdeas(key) {
  const content = readIdeas(key);
  $('idea-content').textContent = content || '这个词条还没有补充。点击「我要补充」添加你的想法。';
  $('idea-content').dataset.empty = String(!content);
  $('idea-status').textContent = sessionOnly.has(key) ? '浏览器存储不可用，本次补充仅保留在当前页面。' : '';
}

function selectTab(nextTab) {
  tab = nextTab;
  document.querySelectorAll('[data-tab]').forEach(button => {
    button.setAttribute('aria-selected', String(button.dataset.tab === tab));
  });
  render();
}

$('note').oninput = () => drafts.set(noteKey(), $('note').value);
$('notes-panel').onsubmit = event => {
  event.preventDefault();
  const addition = $('note').value.trim();
  if (!addition) {
    $('notes-status').textContent = '请先填写补充内容。';
    $('note').focus();
    return;
  }

  const key = noteKey();
  const content = [readIdeas(key), addition].filter(Boolean).join('\n\n');
  sessionNotes.set(key, content);
  try {
    localStorage.setItem(key, content);
    sessionOnly.delete(key);
  } catch {
    sessionOnly.add(key);
  }

  drafts.delete(key);
  selectTab('ideas');
  if (!sessionOnly.has(key)) $('idea-status').textContent = '已加入当前词条的奇思妙想。';
  $('ideas-tab').focus();
};

function render(){const items=library.words,w=items[index],c=direction==='cn';$('subtitle').textContent='高中 · '+library.title;$('library-note').textContent=items.length+' 个演示词条';$('mode-status').textContent=mode==='self'?'自学模式':'挑战模式';$('mode-note').textContent=mode==='self'?'自由翻牌、查看解析，按自己的节奏学习。':'先独立回忆，再翻牌核对，标记掌握情况。';
const notesOpen = tab === 'notes';
const ideasOpen = tab === 'ideas';
const showCard = !notesOpen && !ideasOpen;
$('deck').hidden = !showCard;
$('notes-panel').hidden = !notesOpen;
$('ideas-panel').hidden = !ideasOpen;
$('flip-button').style.visibility = showCard ? '' : 'hidden';
$('feedback').hidden = !showCard;
if (notesOpen) {
  $('note').value = drafts.get(noteKey()) ?? '';
  $('notes-status').textContent = '补充内容按词条保存在当前浏览器。';
}
if (ideasOpen) showIdeas(noteKey());
const cardTab = showCard ? tab : 'sentence';
const en=w[cardTab]||w.word,cn=cardTab==='word'?w.cn:w[cardTab+'Cn']||w.cn;
$('question').textContent=c?cn:en;$('answer').textContent=c?en:cn;for(const id of ['question','answer'])$(id).classList.toggle('long',$(id).textContent.length>65);
$('frontlabel').textContent={word:'单词记忆',phrase:'短语搭配',sentence:'对应义项例句'}[cardTab];$('backlabel').textContent=c?'英文答案':'中文释义';$('fronttag').textContent=c?'中文':'ENGLISH';$('backtag').textContent=c?'ENGLISH':'中文';$('qhint').textContent=mode==='challenge'?'先独立回忆答案。':'先回忆'+(c?'英文':'中文')+'，再翻面核对。';$('ahint').textContent=cardTab==='word'?w.ipa+' · '+w.pos:explain?w.grammar:'';$('ahint').hidden=!$('ahint').textContent;$('counter').textContent=String(index+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');$('bar').style.width=(index+1)/items.length*100+'%';const p=document.querySelector('.progress');p.setAttribute('aria-valuenow',String(index+1));p.setAttribute('aria-valuemax',String(items.length));$('mastered').textContent='已掌握 '+known().size+' / '+items.length+' 个词';$('prev').disabled=index===0;$('next').disabled=index===items.length-1;flip(false)}
function step(n){const i=index+n;if(i>=0&&i<library.words.length){index=i;render()}}
$('grade').onchange=populateLibraries;$('library').onchange=()=>{library=libraries.find(l=>l.id===$('library').value)||library;index=0;render()};$('card').onclick=()=>flip(!flipped);$('flip-button').onclick=()=>flip(!flipped);$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.body.dataset.mode=mode;document.querySelectorAll('[data-mode]').forEach(x=>{if(x.tagName==='BUTTON')x.setAttribute('aria-pressed',String(x===b))});render()});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));$('direction').onchange=e=>{direction=e.target.value;render()};$('explain').onchange=e=>{explain=e.target.value==='on';render()};
$('got').onclick=()=>{known().add(index);$('feedback').textContent='已标记掌握：'+library.words[index].word;if(index<library.words.length-1)step(1);else render()};$('again').onclick=()=>{known().delete(index);$('feedback').textContent='再回忆一次，让记忆更牢固。';render()};document.addEventListener('keydown',e=>{if(e.target===$('idea-content')||['BUTTON','SELECT','INPUT','TEXTAREA','SUMMARY'].includes(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.code==='Space'&&!$('deck').hidden){e.preventDefault();flip(!flipped)}else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1)});populateLibraries();
</script></body></html>
