button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b78931;outline-offset:3px}button:disabled{cursor:default;opacity:.38}header{border-bottom:1px solid var(--line);background:var(--paper)}.head{max-width:1280px;margin:auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:1px}.logo{display:grid;place-items:center;width:35px;height:35px;background:var(--accent);color:white;border-radius:10px;font-size:20px}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:2px;font-weight:600;margin-top:3px}.head a{font-size:13px;color:var(--muted);text-decoration:none}main{max-width:1280px;margin:0 auto;padding:32px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:34px;align-items:start}.sidebar{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;position:sticky;top:20px}.kicker{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:700}.sidebar h2{font-size:18px;margin:8px 0 18px}.field{display:block;margin:14px 0}.field>span{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:var(--muted)}select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper);color:var(--ink);font-size:14px}.library-select{position:relative}.library-select select{background:var(--soft);border-color:transparent;font-weight:750;padding:14px 32px 14px 12px;appearance:none}.library-select:after{content:"⌄";position:absolute;right:13px;top:10px;pointer-events:none;font-size:20px;color:var(--accent)}.unit-caption{font-size:11px;color:var(--muted);line-height:1.6;margin:8px 0 0}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:3px}.mode button,.tabs button{background:transparent;border:0;color:var(--muted);font-weight:700;border-radius:9px;padding:10px 8px;white-space:nowrap}.mode button[aria-pressed=true]{background:var(--paper);color:var(--accent);box-shadow:0 2px 6px #0000000c}.mode-note{min-height:42px;font-size:12px;color:var(--muted);line-height:1.7;margin:10px 0 0}.settings{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px}.settings summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink)}.settings p{font-size:11px;color:var(--muted);line-height:1.7;margin:8px 0 0}.settings .field{margin-bottom:0}.workspace{min-width:0;max-width:900px;width:100%;margin:0 auto}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 22px}.intro h1{font-size:clamp(30px,4vw,42px);letter-spacing:-1.5px;margin:7px 0 5px;line-height:1.2}.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.mode-status{background:var(--soft);color:var(--accent);border-radius:30px;padding:8px 13px;font-size:12px;font-weight:700;white-space:nowrap}.progress-line{display:flex;align-items:center;gap:13px;margin-bottom:19px;font-size:12px;color:var(--muted)}.progress{height:6px;background:var(--line);border-radius:20px;overflow:hidden;flex:1}.progress span{display:block;height:100%;background:var(--accent);border-radius:20px;transition:width .2s}.counter{font-variant-numeric:tabular-nums;font-weight:750;color:var(--ink)}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:0 0 22px}.tabs button{border-radius:9px 9px 0 0;padding:12px 23px;border-bottom:3px solid transparent;font-size:14px}.tabs button[aria-selected=true]{border-color:var(--accent);color:var(--accent);background:var(--soft)}.wordhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;min-height:36px}.wordhead h2{font-size:27px;line-height:1.3;margin:0;overflow-wrap:anywhere}.wordhead span{font-size:13px;color:var(--muted);text-align:right}.deck{position:relative;perspective:1400px;margin-bottom:24px}.deck:before{content:"";position:absolute;inset:9px 12px -7px;background:var(--soft);border:1px solid var(--line);border-radius:22px;transform:rotate(-.6deg)}.card{display:block;width:100%;height:var(--card-height);position:relative;background:transparent;border:0;padding:0;color:inherit;text-align:left}.inner{display:grid;width:100%;height:100%;grid-template-rows:minmax(0,1fr);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.3,1)}.card.flipped .inner{transform:rotateY(180deg)}.face{grid-area:1/1;min-width:0;min-height:0;width:100%;height:100%;padding:28px 34px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;position:relative;overflow:hidden;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 8px 28px #242d2810}.front{background:var(--card);border:1px solid var(--line)}.back{background:var(--back);color:white;transform:rotateY(180deg)}.face:before{content:"";position:absolute;right:-100px;top:-100px;width:300px;height:300px;border:45px solid var(--accent);opacity:.07;border-radius:50%;pointer-events:none}.back:before{border-color:#fff;opacity:.07}.face>*{position:relative;min-width:0}.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.top{font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:750}.back .top{color:#d1e0d9}.tag{background:var(--soft);color:var(--accent);border-radius:7px;padding:6px 10px;letter-spacing:0;font-size:11px;white-space:nowrap}.back .tag{background:var(--gold);color:#302e39}.content{display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:auto;overscroll-behavior:contain;padding:8px 0}.content strong{display:block;font-size:clamp(25px,3.5vw,42px);line-height:1.38;font-weight:760;letter-spacing:-.5px;overflow-wrap:anywhere;flex-shrink:0}.content small{display:block;font-size:14px;line-height:1.6;color:var(--muted);margin-top:14px;flex-shrink:0}.back .content small{color:#d8e4dd}.content:has(strong.long){justify-content:flex-start}.content strong.long{font-size:clamp(20px,2.5vw,30px)}.bottom{border-top:1px solid var(--line);padding-top:13px;font-size:11px;color:var(--muted)}.back .bottom{border-color:#ffffff32;color:#d7e4dc}.flip{display:inline-grid;place-items:center;border-radius:50%;width:33px;height:33px;background:var(--accent);color:white;font-size:19px;margin-left:6px}.back .flip{background:var(--gold);color:#302e39}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.nav button,.review button{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 20px;color:var(--ink);font-weight:700;font-size:13px}.nav .primary{background:var(--accent);color:white;border-color:var(--accent)}.review{display:flex;gap:10px;margin-top:14px;min-height:44px}.review button{flex:1}.review button:last-child{background:var(--soft);border-color:var(--line);color:var(--accent)}.review.inactive{visibility:hidden;pointer-events:none}.feedback{font-size:12px;color:var(--muted);line-height:1.6;min-height:20px;margin:12px 0 0}footer{text-align:center;color:var(--muted);font-size:11px;padding:24px}[hidden]{display:none!important}
@media(max-width:820px){:root{--card-height:340px}main{padding:20px}.layout{grid-template-columns:1fr;gap:22px}.sidebar{position:static;padding:18px}.intro{margin-bottom:16px}.head{padding:15px 20px}.face{padding:23px}.sidebar h2{margin-bottom:12px}.tabs button{padding:11px 17px}.settings{margin-top:12px}.content strong{font-size:clamp(23px,5vw,36px)}}
@media(max-width:390px){:root{--card-height:355px}main{padding:14px}.face{padding:18px}.head{padding:14px}.brand{font-size:14px}.head a{font-size:11px}.bottom{font-size:10px}.nav button{padding:11px 12px}.tabs button{padding:10px 13px}}
@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}
</style></head><body data-mode="self"><header><div class="head"><div class="brand"><span class="logo">✦</span><div>智汇·学堂<small>WORD LAB</small></div></div><a href="index.html">返回首页 ↗</a></div></header>
<main><div class="layout"><aside class="sidebar"><div class="kicker">YOUR LIBRARY</div><h2>词库选择</h2><label class="field"><span>学段</span><select id="grade"><option value="high">高中</option></select></label><label class="field"><span>词库</span><span class="library-select"><select id="library"></select></span></label><p class="unit-caption" id="library-note">已更新 1 套 · 演示数据 3 词</p><hr class="divider"><div class="kicker">STUDY PREFERENCES</div><h2>学习模式</h2><div class="mode" aria-label="学习模式"><button data-mode="self" aria-pressed="true">自学模式</button><button data-mode="challenge" aria-pressed="false">挑战模式</button></div><p class="mode-note" id="mode-note">自由翻牌、查看解析，按自己的节奏学习。</p><details class="settings"><summary>学习设置</summary><label class="field"><span>翻牌方向</span><select id="direction"><option value="cn">中文 → 英文</option><option value="en">英文 → 中文</option></select></label><label class="field"><span>答案解析</span><select id="explain"><option value="on">显示语法提示</option><option value="off">仅显示答案</option></select></label><p>设置即时生效，无需进入其他页面。</p></details><hr class="divider"><div class="kicker">YOUR PROGRESS</div><p id="mastered" style="font-size:13px;margin:10px 0 0">已掌握 0 / 3 个词</p></aside>
<section class="workspace"><div class="intro"><div><div class="kicker">探源 · 琢词 / WORD LAB</div><h1>逐词精讲</h1><p id="subtitle">高中 · 一词多义一</p></div><div class="mode-status" id="mode-status">自学模式</div></div><div class="progress-line"><span>学习进度</span><div class="progress" role="progressbar" aria-label="当前卡片位置" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1"><span id="bar" style="width:33.33%"></span></div><span class="counter" id="counter">01 / 03</span></div>
<div class="tabs" role="tablist" aria-label="学习内容"><button role="tab" data-tab="word" aria-selected="false">单词</button><button role="tab" data-tab="phrase" aria-selected="false">短语</button><button role="tab" data-tab="sentence" aria-selected="true">句子</button></div><div class="wordhead"><h2 id="wordtitle">down</h2><span id="phonetic">/daʊn/ · adv.</span></div><div class="deck"><button class="card" id="card" aria-label="点击翻面" aria-pressed="false"><span class="inner"><span class="face front" id="front"><span class="top"><span id="frontlabel">对应义项例句</span><span class="tag" id="fronttag">中文</span></span><span class="content"><strong id="question"></strong><small id="qhint"></small></span><span class="bottom"><span>智汇学堂 · WORD LAB</span><span>点击翻面 <span class="flip">↻</span></span></span></span><span class="face back" id="back" aria-hidden="true"><span class="top"><span id="backlabel">英文答案</span><span class="tag" id="backtag">ENGLISH</span></span><span class="content"><strong id="answer"></strong><small id="ahint"></small></span><span class="bottom"><span>智汇学堂 · WORD LAB</span><span>返回正面 <span class="flip">↻</span></span></span></span></span></button></div>
<div class="nav"><button id="prev">← 上一张</button><button id="flip-button">翻转卡牌 ↻</button><button class="primary" id="next">下一张 →</button></div><div class="review inactive" id="review" aria-hidden="true"><button id="again" disabled>再记一次</button><button id="got" disabled>已掌握 ✓</button></div><p class="feedback" id="feedback" aria-live="polite">空格翻面 · 左右方向键切换卡片</p></section></div></main><footer>智汇学堂 · 每天进步一点点</footer>
<script>
const words=[{word:'down',ipa:'/daʊn/',pos:'adv.',cn:'作为首付款',phrase:'pay $1,000 down',phraseCn:'先付一千美元作为首付款',sentence:'I paid $1,000 down on the car.',sentenceCn:'我付了一千美元作为这辆车的第一笔款。',grammar:'pay + 金额 + down + on + 商品，表示为某物支付首付款。'},{word:'afford',ipa:'/əˈfɔːd/',pos:'v.',cn:'买得起；负担得起',phrase:'afford to buy',phraseCn:'买得起',sentence:'I cannot afford to buy a new car.',sentenceCn:'我买不起一辆新车。',grammar:'afford to do sth. 表示有能力承担做某事的费用。'},{word:'purchase',ipa:'/ˈpɜːtʃəs/',pos:'v. / n.',cn:'购买',phrase:'make a purchase',phraseCn:'进行购买',sentence:'She purchased a new laptop.',sentenceCn:'她买了一台新笔记本电脑。',grammar:'purchase 可作动词或名词，语气比 buy 更正式。'}];
const libraries=[{id:'polysemy-1',grade:'high',title:'一词多义一',words}];
const $=id=>document.getElementById(id);let library=libraries[0],index=0,tab='sentence',mode='self',direction='cn',flipped=false,explain=true;const mastery=new Map();function known(){if(!mastery.has(library.id))mastery.set(library.id,new Set());return mastery.get(library.id)}
function populateLibraries(){const options=libraries.filter(l=>l.grade===$('grade').value);$('library').replaceChildren(...options.map(l=>{const o=document.createElement('option');o.value=l.id;o.textContent=l.title;return o}));if(options.length){library=options.find(l=>l.id===library.id)||options[0];$('library').value=library.id;}index=0;render()}
function flip(v){flipped=v;$('card').classList.toggle('flipped',v);$('card').setAttribute('aria-pressed',String(v));$('card').setAttribute('aria-label',v?'返回正面':'点击翻面');$('front').setAttribute('aria-hidden',String(v));$('back').setAttribute('aria-hidden',String(!v));$('flip-button').textContent=v?'返回正面 ↻':'翻转卡牌 ↻';const show=v&&mode==='challenge';$('review').classList.toggle('inactive',!show);$('review').setAttribute('aria-hidden',String(!show));$('again').disabled=!show;$('got').disabled=!show}
function render(){const items=library.words,w=items[index],c=direction==='cn';$('subtitle').textContent='高中 · '+library.title;$('library-note').textContent='已更新 '+libraries.filter(l=>l.grade===library.grade).length+' 套 · 当前演示 '+items.length+' 词';$('mode-status').textContent=mode==='self'?'自学模式':'挑战模式';$('mode-note').textContent=mode==='self'?'自由翻牌、查看解析，按自己的节奏学习。':'先独立回忆，再翻牌核对，标记掌握情况。';$('wordtitle').textContent=mode==='challenge'&&c&&tab==='word'?'单词回忆':w.word;$('phonetic').textContent=mode==='challenge'&&c&&tab==='word'?'':w.ipa+' · '+w.pos;
const en=w[tab]||w.word,cn=tab==='word'?w.cn:w[tab+'Cn']||w.cn;
$('question').textContent=c?cn:en;$('answer').textContent=c?en:cn;for(const id of ['question','answer'])$(id).classList.toggle('long',$(id).textContent.length>65);
$('frontlabel').textContent={word:'单词记忆',phrase:'短语搭配',sentence:'对应义项例句'}[tab];$('backlabel').textContent=c?'英文答案':'中文释义';$('fronttag').textContent=c?'中文':'ENGLISH';$('backtag').textContent=c?'ENGLISH':'中文';$('qhint').textContent=mode==='challenge'?'先独立回忆答案。':'先回忆'+(c?'英文':'中文')+'，再翻面核对。';$('ahint').textContent=tab==='word'?w.ipa+' · '+w.pos:explain?w.grammar:'';$('ahint').hidden=!$('ahint').textContent;$('counter').textContent=String(index+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');$('bar').style.width=(index+1)/items.length*100+'%';const p=document.querySelector('.progress');p.setAttribute('aria-valuenow',String(index+1));p.setAttribute('aria-valuemax',String(items.length));$('mastered').textContent='已掌握 '+known().size+' / '+items.length+' 个词';$('prev').disabled=index===0;$('next').disabled=index===items.length-1;flip(false)}
function step(n){const i=index+n;if(i>=0&&i<library.words.length){index=i;render()}}
$('grade').onchange=populateLibraries;$('library').onchange=()=>{library=libraries.find(l=>l.id===$('library').value)||library;index=0;render()};$('card').onclick=()=>flip(!flipped);$('flip-button').onclick=()=>flip(!flipped);$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.body.dataset.mode=mode;document.querySelectorAll('[data-mode]').forEach(x=>{if(x.tagName==='BUTTON')x.setAttribute('aria-pressed',String(x===b))});render()});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));render()});$('direction').onchange=e=>{direction=e.target.value;render()};$('explain').onchange=e=>{explain=e.target.value==='on';render()};
$('got').onclick=()=>{known().add(index);$('feedback').textContent='已标记掌握：'+library.words[index].word;if(index<library.words.length-1)step(1);else render()};$('again').onclick=()=>{known().delete(index);$('feedback').textContent='再回忆一次，让记忆更牢固。';render()};document.addEventListener('keydown',e=>{if(['BUTTON','SELECT','INPUT','TEXTAREA','SUMMARY'].includes(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.code==='Space'){e.preventDefault();flip(!flipped)}else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1)});populateLibraries();
</script></body></html>
